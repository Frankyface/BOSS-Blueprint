name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: >-
          Regenerate the export-visual baselines for THIS runner's platform
          (ubuntu) and upload them as an artifact. Skips the normal CI + deploy.
        type: boolean
        default: false

# Least privilege at the top; the Pages write + OIDC token the deploy needs are
# granted on the deploy job alone, so the job that runs third-party npm code and
# browser binaries can never mint a Pages deployment token.
permissions:
  contents: read

# One Pages deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Lint, test, build, E2E
    # A baseline-regeneration dispatch is not a release: it must not deploy, and
    # `deploy` needs this job, so skipping here skips the deploy with it. On a
    # push `inputs` is empty, which is falsy, so the normal path is untouched.
    if: ${{ !inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    # 40, not 25 — the same story as the 15 → 25 raise below it, one batch later.
    # The E2E suite runs SERIALLY here (workers: 1, retries: 2, three engines).
    # 25 was set for 154 tests × 3 = 462; the v2.5 "ink is design" batch took it to
    # 247 × 3 = 741, and the strengthened `pen-reading` guard alone measures at three
    # window widths × two letter-spacings per engine. Run 30563502233 was killed at
    # 25m07s with ZERO test failures — lint, unit, both builds and most of the E2E
    # already green — reported as "cancelled", exactly as the earlier one was.
    # Note the shape of it: run 30556114726 FINISHED in 24m46s *with* two failures and
    # their retries, and the clean run after it did not. Wall time here tracks how many
    # tests exist, not how many fail, so the budget has to track the suite's size.
    # The budget is a runaway-job guard, not a performance target, and 40 restores real
    # headroom (locally the same suite is ~5.5m in parallel; CI stays at workers: 1 for
    # stability, deliberately — see playwright.config.ts).
    # THE DURABLE FIX IS SHARDING, NOT A BIGGER NUMBER: split this job into a matrix of
    # the three engines and the wall time drops to about a third. That changes what
    # `deploy` depends on and what uploads the Pages artifact, so it is a considered
    # change rather than a hotfix — recorded in docs/decisions.md, 2026-07-30.
    timeout-minutes: 40
    permissions:
      contents: read
      # Read-only: `configure-pages` reads the already-enabled Pages settings.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      # The round-trip package gate is a SEPARATE program with its own lockfile:
      # it imports no app code on purpose (scripts/roundtrip/README.md), so a
      # validator bug in src/export cannot hide from it. Its dependencies are not
      # vendored, and e2e/submit.spec.ts shells out to it, so it must be installed
      # before the E2E run.
      - name: Install round-trip gate dependencies
        run: npm ci --prefix scripts/roundtrip

      # 45 mutations of a known-good package, each of which must be caught by the
      # RIGHT check. This is what makes "the gate passed" mean something.
      - name: Round-trip gate self-test
        run: node selftest/run.mjs
        working-directory: scripts/roundtrip

      # Appendix A equality test A, runnable without the app's test runner: the
      # shipped schema must byte-match the fenced block in export-format.md §2.2.
      - name: Schema sync check (Appendix A test A)
        run: node extract-schema.mjs --check ../../src/export/schema/site.v1.schema.json
        working-directory: scripts/roundtrip

      # Production-mode build that additionally carries the window store seam
      # Playwright asserts on (see src/store/testBridge.ts). Same base path, same
      # bundler settings — only the test hook differs from the deployed build.
      - name: Build (E2E, with test hooks)
        run: npm run build:e2e

      # Browser binaries are ~400 MB and change only when @playwright/test does,
      # so the cache key is the exact resolved version out of package-lock.json.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # The cache only holds the browsers themselves; the apt libraries they link
      # against live outside it and must be installed on a cache hit too.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: E2E tests (production build under the Pages base path)
        run: npx playwright test

      # Rebuild clean so the deployed artifact has no test seam in it.
      - name: Build (deploy artifact)
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # BASELINE FACTORY — manual, and the only job allowed to write screenshots.
  #
  # A per-engine visual baseline is a picture of one operating system's font
  # rasterisation, so the six `-win32` files committed with the renderer cannot
  # serve ubuntu CI. They can only be produced ON ubuntu, which is what this job
  # is: run the export-visual spec with `--update-snapshots=all`, hand back the
  # `-linux` files as an artifact, and let a human commit them. Until they are
  # committed, `e2e/export-visual.spec.ts` skips the comparison with a loud
  # warning rather than failing the main job (see `skipWithoutBaseline` there).
  #
  # It stays manual on purpose. A job that regenerates its own baselines on every
  # push cannot detect a visual regression — it would simply bless it.
  # ---------------------------------------------------------------------------
  update-visual-baselines:
    name: Regenerate export visual baselines (ubuntu)
    if: ${{ inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (E2E, with test hooks)
        run: npm run build:e2e

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # `=all` rather than the bare flag so the mode is explicit in the log, and
      # because `skipWithoutBaseline` keys off exactly this value to know that a
      # missing baseline is the POINT of this run and must not be skipped.
      - name: Write the Linux baselines
        run: npx playwright test e2e/export-visual.spec.ts --update-snapshots=all

      # `always()`: Playwright's exit code on a snapshot-writing run is not the
      # thing we came for — the files are. Upload them either way so a red run
      # still hands back whatever it managed to produce.
      - name: Upload the new baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: e2e/export-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
