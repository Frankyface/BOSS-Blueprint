name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top; the Pages write + OIDC token the deploy needs are
# granted on the deploy job alone, so the job that runs third-party npm code and
# browser binaries can never mint a Pages deployment token.
permissions:
  contents: read

# One Pages deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Lint, test, build, E2E
    runs-on: ubuntu-latest
    # 25, not 15. The E2E suite runs SERIALLY here (workers: 1, retries: 2, three
    # engines) and it grew with the UX-hardening batch to 154 tests × 3 = 462. The
    # run before that batch finished in 14m57s against the 15-minute budget, and the
    # first run after it was killed mid-E2E at 15m16s — a timeout reported as
    # "cancelled", with lint, unit tests and both builds already green. The budget
    # is a runaway-job guard, not a performance target; 25 restores the headroom the
    # serial cross-engine run needs (locally the same suite is ~4-6m in parallel).
    timeout-minutes: 25
    permissions:
      contents: read
      # Read-only: `configure-pages` reads the already-enabled Pages settings.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Production-mode build that additionally carries the window store seam
      # Playwright asserts on (see src/store/testBridge.ts). Same base path, same
      # bundler settings — only the test hook differs from the deployed build.
      - name: Build (E2E, with test hooks)
        run: npm run build:e2e

      # Browser binaries are ~400 MB and change only when @playwright/test does,
      # so the cache key is the exact resolved version out of package-lock.json.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # The cache only holds the browsers themselves; the apt libraries they link
      # against live outside it and must be installed on a cache hit too.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: E2E tests (production build under the Pages base path)
        run: npx playwright test

      # Rebuild clean so the deployed artifact has no test seam in it.
      - name: Build (deploy artifact)
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
